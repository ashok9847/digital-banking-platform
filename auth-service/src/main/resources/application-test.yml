server:
  port: 0

spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWZvci11bml0LXRlc3RzLW9ubHktMjU2Yml0cw==}
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000

logging:
  level:
    com.banking: DEBUG
    org.springframework.security: DEBUG
