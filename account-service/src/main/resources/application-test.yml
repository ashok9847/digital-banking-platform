server:
  port: 0

spring:
  application:
    name: account-service-test
  datasource:
    url: jdbc:h2:mem:account_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWZvci11bml0LXRlc3RzLW9ubHktMjU2Yml0cw==}

internal:
  service:
    key: ${INTERNAL_SERVICE_KEY:test-internal-service-key-for-unit-tests}

logging:
  level:
    com.banking: DEBUG
    org.springframework.security: DEBUG
